# Configuração declarativa do Kong Gateway
# Tutorial completo: ./TUTORIAL_FASTAPI.md
_format_version: "2.1"
_transform: true

services:
  - name: mtdash-api
    url: http://mtdash-api.desenv.cge.mt.gov.br
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          hour: 1000
          policy: local
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - X-API-Key
          credentials: true
    routes:
      - name: mtdash-rota
        paths:
          - /
        strip_path: false
